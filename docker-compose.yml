services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gameshelf_backend
    restart: always

    env_file:
      - ./gameshelf-backend/.env

    user: "1000:1000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - db_volume:/app/data

    expose:
      - 8000

    depends_on:
      - redis

    command: uv run gunicorn main.wsgi:application --bind 0.0.0.0:8000 --workers 3


  rqworker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gameshelf_rqworker
    restart: always

    env_file:
      - ./gameshelf-backend/.env

    user: "1000:1000"

    depends_on:
      - redis

    command: uv run python manage.py rqworker default


  redis:
    image: redis:7-alpine
    container_name: gameshelf_redis

    restart: always

    volumes:
      - redis_data:/data


  nginx:
    image: nginx:stable-alpine
    container_name: gameshelf_nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      - django

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - frontend_dist:/app/dist

volumes:
  static_volume:
  media_volume:
  redis_data:
  db_volume:
  frontend_dist:
