<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Resets universales para clientes de correo */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14; /* gsoscuro */
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table, td {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-space: 0pt;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #0b0e14;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1a1e26; /* Fondo secundario de los paneles */
            border: 1px solid rgba(154, 165, 177, 0.1); /* border-gsgris/10 */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .header-bar {
            height: 6px;
            background-color: #79a998; /* Color representativo / user-color por defecto */
        }
        .body-content {
            padding: 32px;
        }
        .header-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.05em;
            margin-bottom: 30px;
        }
        .header-title span {
            color: #79a998; /* Detalle de marca */
        }
        .content {
            font-size: 15px;
            line-height: 1.6;
            color: #9aa5b1; /* gsgris */
        }
        .content p {
            margin: 0 0 16px 0;
        }
        .content strong {
            color: #ffffff; /* Destacar textos importantes en blanco */
        }
        /* Botón estilo Gameshelf */
        .button {
            display: inline-block;
            padding: 14px 32px;
            background-color: #79a998; /* Color dinámico/menta */
            color: #0b0e14 !important; /* Texto oscuro para contraste */
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 9999px; /* rounded-full */
            transition: all 0.2s ease;
            text-align: center;
        }
        /* Bloque de códigos numéricos */
        .code-display {
            text-align: center;
            font-size: 32px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 6px;
            color: #79a998; /* Destaca con el color de la plataforma */
            background-color: #161a21; /* Mismo fondo que tus inputs */
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(154, 165, 177, 0.15);
            margin: 24px 0;
        }
        .footer {
            padding: 0 32px 32px 32px;
            font-size: 12px;
            line-height: 1.5;
            color: #626d7a; /* gsgris apagado */
            text-align: center;
            border-top: 1px solid rgba(154, 165, 177, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <center class="wrapper">
        <div class="container">
            <div class="header-bar"></div>
            
            <div class="body-content">
                <div class="header-title">
                    Game<span>Shelf</span>
                </div>

                <div class="content">
                    {% block content %}{% endblock %}
                </div>
            </div>

            <div class="footer">
                If you didn’t request this action, you can safely ignore this email.<br>
                &copy; 2026 GameShelf. All rights reserved.
            </div>
        </div>
    </center>
</body>
</html>
